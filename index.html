<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genshin Roulette</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Genshin Roulette</h1>
    </div>
        <button onclick="selectRandomCharacter()">Lancer la roulette</button>
    </div>

    <div class="result-container" id="result-container" style="display: none;">
        <h2>Personnage sélectionné :</h2>
        <img id="character-image" alt="Image du personnage sélectionné">
        <iframe id="character-video" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; border: none; z-index: 1000;" title="YouTube video player" 
        frameborder="0" allow=" autoplay; accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" 
        allowfullscreen></iframe>
    </div>

    <script src="script.js"></script>
